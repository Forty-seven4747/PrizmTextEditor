# =============================================================================
# TEXTEDIT -- fxSDK project configuration (read by Makefile and by `fxsdk`).
#
# This is the modern fxSDK "Makefile" project format, used with gint >= 2.9
# (modern gint ships no Makefile.include; the fxSDK Makefile below replaces it).
#
# Build with:   fxsdk build-cg        (or simply: make)
# The sh-elf toolchain and gint must already be installed in the fxSDK sysroot.
# =============================================================================

# Add-in name used for the output file: textedit.g3a (<= 8 chars).
NAME := textedit
# Title passed to fxgxa -n (what the calculator prints over the icon).
NAME_G3A := TextEdit
# Internal name -- only used to build a .g1a (fx-9860G). The g3a target ignores
# it, but keep it valid anyway.
INTERNAL := @TEXTEDIT

# Output file names; leave empty to derive them from NAME.
TARGET_FX :=
TARGET_CG :=

# Menu icons, 92x64 PNG (regenerate with: python gen_icon.py). The fx-CG 50
# shows ICON_CG_UNS on the menu and swaps in ICON_CG_SEL once the add-in is
# picked, so the two carry the same sheet: blank + caret, then "PRIZM!" typed.
# ICON_FX is only used for the mono .g1a target, so it keeps the CG unselected
# artwork.
ICON_FX     = assets/icon-uns.png
ICON_CG_UNS = assets/icon-uns.png
ICON_CG_SEL = assets/icon-sel.png

#---
# Toolchain
#---
TOOLCHAIN_FX := sh-elf
TOOLCHAIN_CG := sh-elf

#---
# Compiler flags
#---
CFLAGS := -mb -ffreestanding -nostdlib -fstrict-volatile-bitfields
CFLAGS_FX := -D FX9860G -D TARGET_FX9860G -m3
CFLAGS_CG := -D FXCG50  -D TARGET_FXCG50  -m4-nofpu
CFLAGS += -Wall -Wextra -Wno-missing-field-initializers -Os

# Our headers sit next to the sources in src/ and are pulled in with quoted
# includes, so this is belt-and-braces only.
INCLUDE_FX = -I src
INCLUDE_CG = -I src

#---
# Libraries (gint itself is linked from the sysroot)
#
# fxlibc (libc.a) IS the C library here; OpenLibm (libopenlibm.a) provides the
# math functions that fxlibc's printf/strtod pull in. gint's own CMake flow
# links exactly these (cmake/FindGint.cmake: Gint::Fxlibc = libc.a, plus
# INTERFACE_LINK_LIBRARIES "-lopenlibm;-lgcc"), so the Makefile flow must list
# them too. The template's project.cfg leaves these empty only because its
# sample main.c uses nothing but gint; this add-in uses real libc
# (malloc/free/strlen/snprintf/...), so both are required.
#---
LIBS_FX := -lc -lopenlibm
LIBS_CG := -lc -lopenlibm

#---
# Linker flags. fxcg50.ld and libgint-cg come from the gint install in the
# fxSDK sysroot; libgint-cg is listed twice on purpose to resolve the kernel's
# own circular references.
#---
LDFLAGS_FX := -T fx9860g.ld -lgint-fx $(LIBS_FX) -lgint-fx -lgcc
LDFLAGS_CG := -T fxcg50.ld  -lgint-cg $(LIBS_CG) -lgint-cg -lgcc

LDFLAGS :=
LDFLAGS_FX += -Wl,-Map=build-fx/map
LDFLAGS_CG += -Wl,-Map=build-cg/map
